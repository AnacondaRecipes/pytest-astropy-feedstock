{% set name = "pytest-astropy" %}
{% set version = "0.12.0" %}
{% set sha256 = "0bdff1fa67a7856ec899c6f7810a86911253d76201a30822d7e4ef14b671bdc0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pytest_astropy-0.12.0.tar.gz
  sha256: {{ sha256 }}

build:
  skip: true  # [py<37]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps  --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=30.3.0
    - setuptools_scm
    - wheel
  run:
    - python
    - pytest >=4.6
    - pytest-doctestplus >=1.0.0
    - pytest-remotedata >=0.4.1
    - pytest-astropy-header >=0.2.2
    - pytest-arraydiff >=0.5
    - pytest-filter-subpackage >=0.1.2
    - pytest-cov >=2.3.1
    - pytest-mock >=2.0
    - attrs >=19.2.0
    - hypothesis >=5.1
    - pytest-skip-slow >=1.1.0
  run_constrained:
    - pytest-mpl >=0.11

test:
  imports:
    - pytest_astropy
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/astropy/pytest-astropy
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  summary: Meta-package containing dependencies for testing Astropy
  description: |
    This is a meta-package that pulls in the dependencies that are used by
    astropy and some affiliated packages for testing. It can also be used for
    testing packages that are not affiliated with the Astropy project.
  doc_url: https://github.com/astropy/pytest-astropy
  dev_url: https://github.com/astropy/pytest-astropy

extra:
  recipe-maintainers:
    - astrofrog-conda-forge
    - drdavella
    - mwcraig
